[package]
name = "app"
version = "1.9.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures = "0.3"
# 研究暂停闸门异步睡眠 / 删除研究等待任务退出超时(M-4/M-5);与 tauri 内置 tokio 同版本复用
tokio = { version = "1", features = ["time", "net"] }
async-trait = "0.1"
base64 = "0.22"
aes-gcm = "0.10"
sha2 = "0.10"
thiserror = "1"
docx-rs = "0.4"
calamine = "0.36"
pdf-extract = "0.12"
# 绘画历史缩略图(D5):仅 png 解码 + jpeg 缩略图编码
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
rust_xlsxwriter = "0.80"
